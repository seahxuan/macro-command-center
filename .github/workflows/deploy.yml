name: Update Dashboard
on:
  repository_dispatch:
    types: [macro-update]
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Write index.html
        run: echo "${{ github.event.client_payload.content }}" | base64 -d > index.html
      - name: Commit and push
        run: |
          git config user.email "macro-bot@auto.com"
          git config user.name "Macro Bot"
          git add index.html
          git commit -m "macro update $(date -u '+%Y-%m-%d %H:%M')"
          git push
